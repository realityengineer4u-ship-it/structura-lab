      /* never in the way while developing */
      if(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
      var L="en";
      try{
        var saved=(JSON.parse(localStorage.getItem("structura-lab")||"{}").state||{}).lang;
        if(saved==="ar"||saved==="en") L=saved;
        else { var nl=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""]);
          for(var k=0;k<nl.length;k++){ if(String(nl[k]||"").slice(0,2).toLowerCase()==="ar"){ L="ar"; break; } } }
      }catch(e){}
      var T={ar:{t:"الأداة مجانية لمشتركي القناة",s:"بُني «المعمل الإنشائي» (Structura Lab) على نفقة قناة «مهندس الواقع»، بلا إعلانات ولا تسجيل. اشتراكك هو ما يُبقيه مجانيًا.",ch:"مهندس الواقع",n:"· أكثر من 90 ألف مشترك",
